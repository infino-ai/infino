name: ClickBench (Azure)

# Manually-triggered ClickBench run on a per-run ephemeral Azure VM.
#
# The benchmark harness lives in the ClickBench repo (its `infino/` system
# dir); it depends on the *published* `infino` crate, so this job measures the
# released engine, not this repo's working tree. It ingests an N-partition
# subset of the hits dataset into infino, runs the 43-query cold/hot sweep, and
# publishes the results to the Actions run summary. The VM is always torn down.
#
# The binary is built on the VM by default; `prebuilt` instead builds it on the
# runner (Swatinem/rust-cache) and scp's it in — faster repeat runs, less VM
# billing, but the runner glibc/arch must match the VM.

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Rows to ingest; empty = all (~100M)."
        required: false
        default: ""
        type: string
      partitions:
        description: "Partitions to download (~1M rows each; 100 = full)."
        required: false
        default: "100"
        type: string
      target_sf_mb:
        description: "Compacted superfile target (MiB)."
        required: false
        default: "256"
        type: string
      vm_size:
        description: "Azure VM size."
        required: false
        default: "Standard_D16s_v7"
        type: string
      location:
        description: "VM region."
        required: false
        default: "eastus"
        type: string
      clickbench_repo:
        description: "Harness repo."
        required: false
        default: "infino-ai/ClickBench"
        type: string
      clickbench_ref:
        description: "Harness ref."
        required: false
        default: "add-infino"
        type: string
      timeout_minutes:
        description: "Hard auto-stop (min); VM torn down when hit."
        required: false
        default: "120"
        type: string
      prebuilt:
        description: "Build on runner (rust-cache) + scp to VM; off = build on VM."
        required: false
        default: true
        type: boolean

permissions:
  id-token: write   # Azure OIDC federated login
  contents: read

# Serialize dispatches; never cancel a run mid-flight (that would leak a VM).
concurrency:
  group: clickbench-azure
  cancel-in-progress: false

env:
  # Pre-existing RG the bench service principal is scoped to (Contributor on
  # this RG only). Per-run resources are created inside it; the RG is never
  # created or deleted here.
  RG: rg-infino-bench
  VM: clickbench-vm-${{ github.run_id }}
  ADMIN: azureuser
  SSH_OPTS: "-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

jobs:
  clickbench:
    runs-on: ubuntu-latest
    environment: ci
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Prebuilt: build on the runner (cached) before provisioning, so a build
      # failure never leaves a VM billing. Runner glibc/arch must match the VM.
      - name: Checkout harness (runner, prebuilt)
        if: ${{ inputs.prebuilt }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.clickbench_repo }}
          ref: ${{ inputs.clickbench_ref }}
          path: cb
      - name: Rust cache (prebuilt)
        if: ${{ inputs.prebuilt }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cb/infino/bench
      - name: Build binary (runner, prebuilt)
        if: ${{ inputs.prebuilt }}
        run: cargo build --release --manifest-path cb/infino/bench/Cargo.toml

      - name: Provision ephemeral VM
        id: provision
        run: |
          set -euo pipefail
          # delete-after lets the shared bench janitor reclaim this if teardown
          # is skipped (run cancelled / runner lost).
          DELETE_AFTER="$(date -u -d '+3 hours' +%Y-%m-%dT%H:%M:%SZ)"
          TAGS=(purpose=clickbench-bench "run-id=${{ github.run_id }}" auto-delete=true "delete-after=${DELETE_AFTER}")

          # Every resource carries the unique per-run VM name so teardown deletes
          # exactly this run's resources by name. No default inbound rule; the
          # only SSH allow is the runner-IP /32 added below.
          az vm create \
            -g "$RG" -n "$VM" \
            --image Ubuntu2404 \
            --size "${{ inputs.vm_size }}" \
            --admin-username "$ADMIN" \
            --generate-ssh-keys \
            --public-ip-sku Standard \
            --os-disk-size-gb 128 \
            --nsg-rule NONE \
            --nsg "${VM}-nsg" \
            --public-ip-address "${VM}-pip" \
            --vnet-name "${VM}-vnet" \
            --subnet "${VM}-subnet" \
            --os-disk-name "${VM}-osdisk" \
            --location "${{ inputs.location }}" \
            --tags "${TAGS[@]}" \
            -o none

          RUNNER_IP="$(curl -s https://api.ipify.org)"
          az network nsg rule create \
            -g "$RG" --nsg-name "${VM}-nsg" -n allow-ssh-runner --priority 300 \
            --access Allow --protocol Tcp --direction Inbound \
            --destination-port-ranges 22 \
            --source-address-prefixes "${RUNNER_IP}/32" -o none

          VM_IP="$(az vm show -d -g "$RG" -n "$VM" --query publicIps -o tsv)"
          echo "vm_ip=$VM_IP" >> "$GITHUB_OUTPUT"
          echo "Provisioned $VM (${{ inputs.vm_size }}) at $VM_IP in ${{ inputs.location }}"

      - name: Wait for SSH
        run: |
          set -euo pipefail
          VM_IP="${{ steps.provision.outputs.vm_ip }}"
          for i in $(seq 1 30); do
            if ssh $SSH_OPTS -o ConnectTimeout=5 "${ADMIN}@${VM_IP}" true 2>/dev/null; then
              echo "SSH up after ${i} tries"; exit 0
            fi
            sleep 10
          done
          echo "::error::SSH never came up"; exit 1

      - name: Clone harness (on VM)
        run: |
          set -euo pipefail
          VM_IP="${{ steps.provision.outputs.vm_ip }}"
          ssh $SSH_OPTS "${ADMIN}@${VM_IP}" \
            "CB_REPO='${{ inputs.clickbench_repo }}' CB_REF='${{ inputs.clickbench_ref }}' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git wget curl ca-certificates
          rm -rf "$HOME/ClickBench"
          git clone --depth 1 --branch "$CB_REF" \
            "https://github.com/${CB_REPO}.git" "$HOME/ClickBench"
          REMOTE

      # Prebuilt mode: ship the runner-built binary into the crate's release
      # dir so ./install short-circuits (uses it instead of building).
      - name: Copy prebuilt binary to VM
        if: ${{ inputs.prebuilt }}
        run: |
          set -euo pipefail
          VM_IP="${{ steps.provision.outputs.vm_ip }}"
          DEST="ClickBench/infino/bench/target/release"
          ssh $SSH_OPTS "${ADMIN}@${VM_IP}" "mkdir -p '$DEST'"
          scp $SSH_OPTS cb/infino/bench/target/release/clickbench-infino \
            "${ADMIN}@${VM_IP}:${DEST}/clickbench-infino"

      - name: Ingest + sweep (on VM)
        id: run
        run: |
          set -euo pipefail
          VM_IP="${{ steps.provision.outputs.vm_ip }}"
          ssh $SSH_OPTS "${ADMIN}@${VM_IP}" \
            "PREBUILT='${{ inputs.prebuilt }}' \
             PARTS='${{ inputs.partitions }}' \
             ROWS='${{ inputs.rows }}' \
             TARGET_SF_MB='${{ inputs.target_sf_mb }}' \
             bash -s" <<'REMOTE' 2>&1 | tee /tmp/clickbench.log
          set -euo pipefail
          cd "$HOME/ClickBench/infino"

          # VM builds only when no prebuilt binary was copied in.
          if [ "$PREBUILT" != "true" ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential pkg-config libssl-dev
            if ! command -v cargo >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf \
                --retry 5 --retry-connrefused --retry-delay 2 https://sh.rustup.rs \
                | sh -s -- -y --profile minimal
            fi
            source "$HOME/.cargo/env"
          fi

          echo "===== BUILD/INSTALL ====="
          ./install                      # prebuilt: no-op; else cargo build --release
          ./check                        # fail fast; also verifies a prebuilt binary execs on this VM
          RESOLVED="$(grep -A1 '^name = "infino"' bench/Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "infino crate: ${RESOLVED}"

          echo "===== DOWNLOAD (${PARTS} partitions) ====="
          END=$((PARTS - 1))
          seq 0 "$END" | xargs -P"$(( PARTS < 16 ? PARTS : 16 ))" -I{} \
            wget -q --continue \
            "https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_{}.parquet"

          echo "===== LOAD (rows=${ROWS} target_sf=${TARGET_SF_MB}MB) ====="
          t0=$(date +%s.%N)
          INFINO_SRC="hits_*.parquet" INFINO_MAX_ROWS="$ROWS" INFINO_TARGET_SF_MB="$TARGET_SF_MB" ./load
          t1=$(date +%s.%N)
          awk -v a="$t0" -v b="$t1" 'BEGIN{printf "LOAD_TIME=%.1fs\n", b-a}'
          echo "DATA_SIZE_BYTES=$(./data-size)"

          echo "===== SWEEP ====="
          ./bench.sh
          REMOTE

      - name: Publish summary
        if: ${{ !cancelled() }}
        run: |
          set +e -u -o pipefail
          LOG=/tmp/clickbench.log
          {
            echo "## ClickBench — infino (Azure ${{ inputs.location }})"
            echo ""
            infino_ver="$(grep -oE 'infino crate: .*' "$LOG" | head -1 | sed 's/infino crate: //')"
            load_time="$(grep -oE 'LOAD_TIME=[0-9.]+s' "$LOG" | head -1 | cut -d= -f2)"
            data_sz="$(grep -oE 'DATA_SIZE_BYTES=[0-9]+' "$LOG" | head -1 | cut -d= -f2)"
            geomean="$(grep -oE 'hot geomean: .*' "$LOG" | head -1)"
            echo "- infino \`${infino_ver:-?}\` · vm \`${{ inputs.vm_size }}\` · rows \`${{ inputs.rows != '' && inputs.rows || 'all (~100M)' }}\` · target_sf \`${{ inputs.target_sf_mb }}MB\`"
            echo "- load \`${load_time:-?}\` · data size \`$(( ${data_sz:-0} / 1000000 )) MB\` · **${geomean:-hot geomean: n/a}**"
            echo ""
            if grep -q 'hot geomean' "$LOG"; then
              echo "### Cold/hot per query (seconds)"
              echo "| Q | cold | t2 | t3 | hot |"
              echo "|--:|--:|--:|--:|--:|"
              # Sweep data rows start with the query number; render as a table.
              awk '/^[0-9]+[[:space:]]/{printf "| %s | %s | %s | %s | %s |\n",$1,$2,$3,$4,$5}' "$LOG"
            else
              echo "**❌ No sweep results — see the uploaded log.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Surface hard failures loudly.
          if ! grep -q 'hot geomean' "$LOG"; then
            echo "::error::ClickBench sweep produced no results."
            exit 1
          fi

      - name: Upload full log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: clickbench-log
          path: /tmp/clickbench.log
          if-no-files-found: warn

      - name: Teardown (always)
        if: always()
        env:
          NIC: ${{ env.VM }}VMNic
        run: |
          # Delete exactly this run's resources by name (VM name is unique per
          # run), keeping the shared RG. Ordered so dependencies release first.
          # Each is best-effort so a missing resource never fails teardown.
          az vm delete                -g "$RG" -n "$VM"           --yes || true
          az network nic delete       -g "$RG" -n "$NIC"                || true
          az disk delete              -g "$RG" -n "${VM}-osdisk"  --yes || true
          az network public-ip delete -g "$RG" -n "${VM}-pip"           || true
          az network nsg delete       -g "$RG" -n "${VM}-nsg"           || true
          az network vnet delete      -g "$RG" -n "${VM}-vnet"          || true
