name: Benchmark

# Each PR is benchmarked A/B on one VM: the PR ref and base `main` are built
# and run side by side and the PR is compared against that same-host main arm
# (see supertable-bench-azure.yml). Findings are informational except the one
# designated warm gate metric, which blocks the merge past >50% AND >5 ms.
# Uses `pull_request_target` (not `pull_request`) so the job runs in the
# base-repo context where the Azure secrets live — a fork `pull_request` run
# gets none. Fork code is gated on maintainer approval before secrets are
# exposed (see `is_fork_pr`).
on:
  push:
    branches: [main]
    # Only refresh the baseline when perf-relevant code lands. Doc/example/
    # binding-only merges can't move performance, so skip the VM spin-up.
    # (GitHub Actions ignores YAML anchors, so the list is repeated below.)
    paths:
      - "src/**"
      - "benches/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/bench.yml"
      - ".github/workflows/supertable-bench-azure.yml"
      # The merge gate itself: a change to the classifier must be re-benchmarked.
      - ".github/scripts/bench_summary.py"
  pull_request_target:
    branches: [main]
    # Code/state changes only — never on label or comment activity.
    types: [opened, synchronize, reopened]
    # Same allowlist: skip the 4-VM bench on doc/example/binding-only PRs.
    paths:
      - "src/**"
      - "benches/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/bench.yml"
      - ".github/workflows/supertable-bench-azure.yml"
      # The merge gate itself: a change to the classifier must be re-benchmarked.
      - ".github/scripts/bench_summary.py"

jobs:
  bench:
    # Skip on forks (no Azure secrets); fork PRs into upstream still run.
    if: github.repository_owner == 'infino-ai'
    strategy:
      fail-fast: false # one member failing must not cancel the other
      matrix:
        # One modality per leg, each on its own VM. `suffix` keeps per-leg
        # resources and comment markers unique (all legs share one run_id).
        include:
          # Every superfile cell, every phase: for the FTS cell that is
          # build + warm + cold + quality on the realistic text corpus, so
          # the single-file BM25 oracle gates every bench run alongside the
          # supertable one below.
          #
          # The corpus is stated rather than left to the FTS cells' default
          # because both A/B arms read this one argument string: the PR arm
          # runs this branch's default and the baseline arm runs main's, so
          # a leg that says nothing compares two different corpora the
          # moment the default moves — which it just did, and every FTS row
          # read as a several-hundred-percent regression. Naming it here
          # puts both arms on the same corpus whatever either side defaults
          # to. The other generated flavour is `synthetic`.
          #
          # The ceiling is raised with it: this leg runs the FTS, vector
          # and SQL superfile cells across two arms, and the realistic
          # corpus is ~6x the synthetic bytes at equal docs, the same
          # reason the two supertable FTS legs below sit at 75.
          - { bench: superfile,         docs: "1000000", suffix: sf, corpus: realistic, timeout_minutes: "90" }
          # The FTS legs run the generated realistic text corpus — the one
          # the quality oracle is calibrated on, and the FTS cells' default
          # (stated here so the leg reads the same whatever the default).
          # The synthetic corpus draws every battery token from one Zipf,
          # so its "common-word" phrases pair near-universal terms whose
          # per-superfile idf is degenerate (~0 and hypersensitive to shard
          # df); grading FTS perf and quality there rewards scoring
          # artifacts of that degeneracy instead of behavior on text-shaped
          # term distributions.
          # The FTS cell runs as two legs split by read phase. The realistic
          # corpus is ~6x the synthetic bytes at equal docs and cold
          # measurement pays per byte, so one combined leg overran the
          # 60-minute default mid baseline arm; splitting lets the
          # gate-bearing warm leg (build + quality + warm) report in under
          # an hour while the byte-bound cold battery runs in parallel on
          # its own VM. Ceilings are sized per leg for two A/B arms plus
          # VM provision and compile.
          - { bench: supertable_fts_warm, docs: "1000000", suffix: st-fts-warm, corpus: realistic, timeout_minutes: "75" }
          - { bench: supertable_fts_cold, docs: "1000000", suffix: st-fts-cold, corpus: realistic, timeout_minutes: "75" }
          - { bench: supertable_vector, docs: "1000000", suffix: st-vec }
          # Non-cosine (L2) leg: exercises the Sq16Adaptive default codec
          # (the cosine leg above stays on the fixed-grid Sq16).
          - { bench: supertable_vector, docs: "1000000", suffix: st-vec-l2, metric: l2sq }
          - { bench: supertable_sql,    docs: "1000000", suffix: st-sql }
    # A new push to the PR cancels the in-flight run for that bench.
    # Keyed on the SUFFIX, not the bench name: the two vector cells
    # (cosine st-vec and l2sq st-vec-l2) share `matrix.bench`, and a
    # bench-keyed group made them cancel each other on every run.
    concurrency:
      group: bench-${{ github.event.pull_request.number }}-${{ matrix.suffix }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      # Kept so summary_destination=pr_comment stays usable; PR runs default to
      # step_summary, so this path is exercised only by a manual dispatch.
      pull-requests: write
    uses: ./.github/workflows/supertable-bench-azure.yml
    with:
      bench: ${{ matrix.bench }}
      docs: ${{ matrix.docs }}
      metric: ${{ matrix.metric }}
      corpus: ${{ matrix.corpus }}
      corpus_dir: ${{ matrix.corpus_dir }}
      # Per-leg ceiling; legs without one keep the callee's default.
      timeout_minutes: ${{ matrix.timeout_minutes || '60' }}
      ref: ${{ github.event.pull_request.head.sha }}
      name_suffix: -${{ matrix.suffix }}
      pr_number: ${{ github.event.pull_request.number }}
      # Fork PR ⇒ gate on maintainer approval before secrets are exposed.
      # Guard on the event: a push has no pull_request context, so the bare
      # inequality would treat every push as a fork and route it to the
      # approval-gated environment, leaving baseline runs stuck awaiting review.
      is_fork_pr: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
    secrets: inherit
