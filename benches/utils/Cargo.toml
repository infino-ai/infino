[package]
name = "infino-bench-utils"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "mod.rs"
bench = false

[[bin]]
name = "profile_superfile"
path = "bin/profile_superfile.rs"
bench = false


[dependencies]
arrow-array = "58"
arrow-schema = "58"
async-trait = "0.1"
bytemuck = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
datafusion = "54"
futures = "0.3"
infino = { path = "../..", features = ["test-helpers"] }
memmap2 = "0.9"
num_cpus = "1"
object_store = { version = "0.13", features = ["aws"] }
parquet = "58"
rand = "0.10"
rand_distr = "0.6"
rayon = "1"
# rustix — safe posix_fadvise(DONTNEED) + sync for the disk-warm serving-state
# diagnostic (`disk_warm.rs`): drop the OS page cache under the local disk
# cache without unsafe libc calls. Already in the dependency tree
# transitively (tokio/tempfile).
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }

# RustFS local bench backend (`rustfs_server.rs`):
# rcgen — generate bench-local TLS CA + server cert (no openssl CLI / sudo).
# zip — extract pinned RustFS release archives downloaded from GitHub.
# reqwest — blocking HTTPS for release download, /health poll, and CreateBucket.
# sha2 / hmac / hex — verify upstream SHA256SUMS and sign SigV4 CreateBucket.
rcgen = "0.14"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# Static build (vendored HDF5 C sources) so this stays a pure cargo dep:
# no system libhdf5, no runner/VM provisioning coupling (the A/B bench VM
# is provisioned by MAIN's workflow via pull_request_target, so a PR can
# never install system packages for itself). Pinned to 0.11: the newest
# hdf5-metno whose static build vendors an HDF5 tree with a cmake floor
# of 3.18 (hdf5-metno-src 0.9.x, HDF5 1.14.6) — 0.12+ pulls src 0.10.x,
# which demands cmake 3.26 and fails on Ubuntu 22.04's apt cmake 3.22.
hdf5 = { version = "0.11.0", package = "hdf5-metno", features = ["static"] }
# `corpus.rs` passes `ndarray::s![...]` straight into hdf5-metno's API when
# reading HDF5 datasets, so this must be the SAME ndarray hdf5-metno 0.11.0
# resolves to — which is 0.17.2 (`cargo tree -i ndarray`). Pinned to that
# version explicitly rather than left to the resolver: a benchmark A/B
# compares absolute times across two builds, so a dependency free to move
# between them is a measurement hazard, not just untidy.
#
# A wildcard was tried here to unify the graph for a DOWNSTREAM consumer
# (`retrievalbench`, which also links lancedb's lance-index and its own
# ndarray). That was the wrong place: the wildcard resolves to 0.17.2 anyway,
# so it changed nothing here, and a conflict between two of a consumer's
# dependencies is the consumer's to resolve. Loosening an upstream pin to fix
# a downstream graph just moves the non-determinism somewhere it is harder to
# see.
ndarray = "0.17.2"
