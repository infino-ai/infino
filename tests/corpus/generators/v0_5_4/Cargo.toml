# Writes one corpus table with the engine as it shipped in 0.5.4: the positions-region layout that predates the sub-index and bitset blocks.
# Detached from the engine workspace (`[workspace]` below) so this pinned,
# year-old dependency graph never takes part in resolving the engine's own.
[package]
name = "corpus-gen-0-5-4"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Exact: the point of this crate is the bytes this one release writes.
infino = "=0.5.4"
