# Reindexes a copy of an older corpus table with the engine as it shipped in
# 0.9.0: the release whose reindex left a stale copy of the vector region
# keys in every footer it carried a vector subsection through.
# Detached from the engine workspace (`[workspace]` below) so this pinned
# dependency graph never takes part in resolving the engine's own.
[package]
name = "corpus-gen-0-9-0"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Exact: the point of this crate is the bytes this one release writes.
infino = "=0.9.0"
